name: cnp_navigator
description: Activity Booking and Wildlife Exploration System for Chitwan National Park

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Localization and Formatting
  intl: ^0.19.0

  # Firebase - Versions aligned to avoid conflict
  firebase_core: ^3.10.1
  firebase_auth: ^5.3.1  # Adjusted version for compatibility

  # State Management
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5
  
  # Dependency Injection
  get_it: ^7.6.4
  
  # Functional Programming
  dartz: ^0.10.1
  
  # Environment Variables
  flutter_dotenv: ^5.1.0
  
  # UI
  cupertino_icons: ^1.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  
  assets:
    - .env
    - assets/images/rhino1.png